name: Web (GitHub Pages)

# Nasazuje statický web: kořen = specimen, /twin-peaks/ = hra.
on:
  push:
    branches:
      - claude/koukl-ses-tohle-pustil-8hsw83
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Poskládat web
        run: |
          mkdir -p _site/twin-peaks
          cp -r twin-peaks/. _site/twin-peaks/
          cp index.html _site/index.html
          # soukromý dárek — ať to nesbírají vyhledávače
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          ls -R _site | head -40

      - name: Nastavit Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Nahrát artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Nasadit
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Twin Peaks: Ztracená kazeta — krátká point-and-click adventura.">
<meta name="robots" content="noindex, nofollow">
<title>Twin Peaks: Ztracená kazeta</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #08090a; color: #8d9aa0;
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden; overscroll-behavior: none;
  }
  #stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #14100e 0%, #08090a 70%);
  }
  #stage { flex-direction: column; gap: 14px; }
  #rotate { display: none; margin: 0; font-size: 12px; color: #6d5f4e; letter-spacing: 0.04em; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: block; } }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 0 1px #2a231d, 0 12px 48px rgba(0,0,0,0.7);
    background: #000;
  }
</style>
</head>

  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <p id="rotate">otoč telefon na šířku</p>

  <script>
/* src/data/items.js */
/* Předměty v inventáři. */
(function () {
  const TP = (window.TP = window.TP || {});
  TP.data = TP.data || {};

  TP.data.items = {
    diktafon: {
      name: 'diktafon', acc: 'diktafon', short: 'DIK', color: '#4a5257',
      takeLine: 'Beru si diktafon. Není Cooperův, ale je přesně jako Cooperův.',
      look: [{ say: 'Stejný model, stejné oděrky. Na spodku štítek: 315, Great Northern.' },
             { say: 'Uvnitř kazeta. Hraje jen šum — a pod ním něco, co šum není.' }],
      failLine: 'Nahrávat teď nemá smysl.',
    },
    zapisnik: {
      name: 'zápisník', acc: 'zápisník', short: 'ZÁP', color: '#a08f76',
      takeLine: 'Normin zápisník objednávek. Snad mi to odpustí.',
      look: [{ say: '„Stůl 2: dva koláče, káva. Platil kanadskými. Jerry H.“' },
             { say: 'Jerry Horne. Seděl přesně tam, kde ležel Cooperův diktafon.' }],
    },
    hrnek: {
      name: 'prázdný hrnek', acc: 'hrnek', short: 'HRN', color: '#d9dcdb',
      takeLine: 'Cooperův hrnek. Na dně kruh od kávy jako roční kruh stromu.',
      look: [{ say: 'Něco, co tu někdo zanechal. Ani ho nedopil — odešel uprostřed věty.' }],
    },
    kolac: {
      name: 'koláč s sebou', acc: 'koláč', short: 'KOL', color: '#a81c22',
      takeLine: 'Višňový, zabalený. Norma říká, že se hodí vždycky.',
      look: [{ say: 'Višňový koláč v papíru. Pořád ještě teplý.' }],
    },
    mouka: {
      name: 'hrnek mouky', acc: 'mouku', short: 'MOU', color: '#e8dcc0',
      takeLine: 'Hrnek mouky. V kriminálce se tomu asi říká jinak.',
      look: [{ say: 'Jemná mouka. Drží se všeho, čeho se dotknu — což je přesně to, co potřebuju.' }],
    },
    karta: {
      name: 'univerzální karta', acc: 'kartu', short: 'KAR', color: '#f0c060',
      takeLine: 'Univerzální karta. Otevře všechno v hotelu, prý i věci, co otevřené být nemají.',
      look: [{ say: 'Plastová karta bez popisu. Ben Horne ji hlídá míň než svoje historky o Kanadě.' }],
    },
    uniforma: {
      name: 'uniforma pokojské', acc: 'uniformu', short: 'UNI', color: '#55606b',
      takeLine: 'Uniforma a gumové rukavice. Dneska jsem servírka i pokojská.',
      look: [{ say: 'Šedomodrá uniforma a rukavice. V rukavicích nedělám otisky — to se hodí.' }],
    },
    uctenka: {
      name: 'účtenka z Kanady', acc: 'účtenku', short: 'ÚČT', color: '#d8cba8',
      takeLine: 'Účtenka. Z místa, kde platí jiné peníze.',
      look: [{ say: '„Bar Rendez-vous, Kanada.“ Datum: včera. Dvě whisky a telefon.' }],
    },
    paska: {
      name: 'lepicí páska', acc: 'pásku', short: 'PÁS', color: '#c9903a',

      look: [{ say: 'Na pásce je otisk palce. Někdo ji odtrhl v rychlosti — něco odebral.' }],
    },
    kapesnik: {
      name: 'kapesník', acc: 'kapesník', short: 'KAP', color: '#efe7d8',
      takeLine: 'Kapesník. Na téhle stanici spotřební materiál.',

      {
        if: { has: 'souprava' },

          { say: 'Štětečkem nanesu mouku na pásku. Prach se chytí přesně tam, kde má.' },
          { sfx: 'flag' },
          { say: 'Otisk je čitelný. Porovnám ho s kartou z kartotéky…' },
          { flag: 'otiskyShoda' },
          { say: 'Jerry Horne. Shoda. Ten otisk sedí jako klíč do zámku.' },

        else: [{ say: 'Sypat mouku na pásku v ruce? Takhle si jen umažu zástěru. Potřebuju pořádnou soupravu.' }],
      },
    ],
  };
  TP.data.items.souprava.combine = {
    paska: [{ say: 'Souprava sama otisk nevyvolá. Chce to prášek — nebo něco, co se prášku hodně podobá.' }],
    mouka: [{ say: 'Mouka i souprava. Teď potřebuju plochu, na které někdo nechal prst.' }],
  };
  TP.data.items.diktafon.combine = {
    zapisnik: [{ say: 'Diktafon a zápisník. Dvě verze jednoho rána, obě neúplné.' }],
  };
  TP.data.items.kolac.combine = {
    hrnek: [{ say: 'Koláč a prázdný hrnek. Vypadá to skoro jako Cooperovo ráno.' }],
  };
})();

/* Konvice je jen tutoriálový předmět — po dolití se vrací na plotnu. */
(function () {

  TP.data.items.konvice = {

    failLine: 'Tohle polít kávou by nepomohlo ničemu.',
  };
})();

  </script>
  <script>
/* src/data/dialogues.js */
/* Dialogové stromy. Uzel: by (kdo mluví), text (řádek nebo pole řádků),
   do (akce), next (další uzel) nebo choices (volby). */
(function () {
  const TP = (window.TP = window.TP || {});
  TP.data = TP.data || {};

  TP.data.dialogues = {

    uvod: {
      start: 'a',
      nodes: {
        a: { by: 'cooper', text: [
          'Diane, sedm hodin a dvanáct minut. Double R Diner. Káva je horká, koláč čerstvý a svět zatím drží pohromadě.',
          'Vracím se od šerifa a… Diane, tohle není můj diktafon.',
        ], next: 'b' },
        b: { by: 'natalie', text: 'Vypadá stejně. Stejný model, stejný škrábanec na boku.', next: 'c' },
        c: { by: 'cooper', text: 'Přesně tak. Stejný — a přesto cizí. To je v tomhle městě nejnebezpečnější kombinace.', next: 'd' },
        d: { by: 'cooper', text: 'A hraje jen šum. Někdo si odnesl moji kazetu a nechal mi místo ní ticho.', next: 'e' },
        e: { by: 'natalie', text: 'Na spodku má štítek. Tři sta patnáct. To je pokoj v Great Northern.', next: 'f' },
        f: { by: 'cooper', text: [
          'Natálie, nejde jen o vyměněnou kazetu. Když se v Twin Peaks stane něco malého, je to vždycky dveře k něčemu velkému.',
        ], next: 'g' },
        g: { choices: [
          { text: '„Co mám udělat?“', to: 'h' },
          { text: '„Proč já? Jsem tu první den.“', to: 'i' },
          { text: '„A co když se spletete?“', to: 'j' },
        ] },
        h: { by: 'cooper', text: 'Zjistěte, kdo tu dnes ráno seděl. Pak jděte tam, kam vás to pošle. A nikam jinam se nedívejte — dívejte se přesně tam.', next: 'k' },
        i: { by: 'cooper', text: 'Protože si všímáte. Toho štítku jste si všimla vy, a já se na diktafony dívám profesionálně.', next: 'h' },
        j: { by: 'cooper', text: 'Pak se spletu nahlas a před svědkem. To je jediný způsob, jak se mýlit správně.', next: 'h' },
        k: { by: 'cooper', text: 'Musím na výslech. S vámi to zvládnu.', do: [{ flag: 'intro' }], next: 'l' },
        l: { by: 'natalie', text: 'Dobře. Začnu tím, co mám na dosah.', end: true },
      },
    },

    cooper_diner: {
      start: 'a',
      nodes: {
        a: { by: 'cooper', text: 'Ještě pořád tady? Kazeta cestuje, Natálie. Kazety mají nohy.', end: true },
      },
    },

    norma: {
      start: 'a',
      nodes: {
        a: { by: 'norma', text: 'Jak ti to jde, zlato?', next: 'b' },
        b: { choices: [
          { text: '„Kdo tu dnes ráno seděl u pultu?“', to: 'hoste' },
          { text: '„Můžu si půjčit tvůj zápisník?“', to: 'zapisnik' },
          { text: '„Co mám dělat?“', to: 'ukol' },
          { text: '„Nic. Jen se koukám.“', to: 'konec' },
        ] },
        hoste: { by: 'norma', text: [
          'Ráno? Řidič, paní s kloboukem, pán s novinami. A jeden pán v drahém kabátě, co si dal dva koláče.',
          'Platil kanadskými dolary a tvářil se u toho, jako bych mu měla poděkovat.',

        zapisnik: { by: 'norma', text: 'Zápisník leží na pultu. Ale vrať ho — v něm je celé tohle město seřazené podle objednávek.', next: 'b' },
        ukol: { by: 'norma', text: 'Nalij kávu všem třem u pultu. Do tří čtvrtin. Kdo nalije až po okraj, tomu nevěřím.', next: 'b' },
        konec: { by: 'norma', text: 'Jen se koukej. Tady se většina práce udělá koukáním.', end: true },
      },
    },

    ben: {
      start: 'a',
      nodes: {
        a: { by: 'ben', text: 'Slečno! Great Northern vítá hosty, dodavatele a dámy se zástěrou. Co pro vás můžu udělat?', next: 'b' },
        b: { choices: [
          { text: '„Potřebuju se podívat do pokoje 315.“', to: 'ne' },

          { text: '„Slyšela jsem, že obchodujete s Kanadou.“', to: 'kanada' },
          { text: '„Nic, děkuju.“', to: 'konec' },

        ne: { by: 'ben', text: 'Pokoje svých hostů nedávám ani šerifovi. Zvlášť ne šerifovi. Zvlášť ne dnes.', next: 'b' },
        jerry: { by: 'ben', text: [
          'Jerry? Jerry je v Kanadě. Jerry je vždycky v Kanadě, i když stojí vedle mě.',
          'Ale to vy nechcete slyšet. Vy chcete slyšet o trhu.',
        ], next: 'b' },
        kanada: { by: 'ben', text: [
          'Kanada, slečno! Kdybyste věděla, co to je za trh! Dřevo, ryby, pozemky a lidé, kteří se na všechno usmívají.',
          'Sedněte si. Řeknu vám o tom všechno. Začneme rokem, kdy jsem tam jel poprvé, a skončíme dnešním ránem.',

        kanada2: { by: 'ben', text: [
          'Představte si les, který nikdo nepočítá. Představte si dolar, který vypadá jako dolar, ale chová se jinak…',

        kanada3: { by: 'natalie', text: 'Ben se otočil k oknu a mluví do skla. Na tabuli s klíči se nedívá už půl minuty.', end: true },
        konec: { by: 'ben', text: 'Kdybyste si to rozmyslela, jsem tady. Vždycky jsem tady.', end: true },
      },
    },

    pokojska: {
      start: 'a',
      nodes: {
        a: { by: 'pokojska', text: [
          'Třináctka chce ručníky, patnáctka nechce nic a ve třistapatnáctce se od včerejška nesvítí.',

        b: { choices: [
          { text: '„Kdo bydlí ve 315?“', to: 'kdo' },

          { text: '„Nic, jdu dál.“', to: 'konec' },

        kdo: { by: 'pokojska', text: 'Pán v drahém kabátě. Je tam zapsaný týden a spal tam jednu noc. Ostatní noci má postel ustlanou jako v katalogu.', next: 'b' },

    lucy: {

  <script>
/* src/engine/util.js */
/* Twin Peaks: Ztracená kazeta — drobné pomocné funkce. */
(function () {
  const TP = (window.TP = window.TP || {});

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }

  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function closestOnSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return [ax, ay];
    let t = ((px - ax) * dx + (py - ay) * dy) / len2;
    t = clamp(t, 0, 1);
    return [ax + dx * t, ay + dy * t];
  }

  /** Nejbližší bod uvnitř (nebo na hraně) walkboxu. */
  function clampToPoly(x, y, poly) {
    if (!poly || poly.length < 3) return [x, y];
    if (pointInPoly(x, y, poly)) return [x, y];
    let best = null, bestD = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const p = closestOnSegment(x, y, poly[j][0], poly[j][1], poly[i][0], poly[i][1]);
      const d = dist(x, y, p[0], p[1]);
      if (d < bestD) { bestD = d; best = p; }
    }
    return best || [x, y];
  }

  /** Zalomení textu na řádky podle šířky v pixelech. */
  function wrap(ctx, text, maxWidth) {
    const out = [];
    String(text).split('\n').forEach((para) => {
      const words = para.split(' ');
      let line = '';
      words.forEach((w) => {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxWidth && line) { out.push(line); line = w; }
        else line = test;
      });
      out.push(line);
    });
    return out;
  }

  function rectHit(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  TP.util = { clamp, lerp, dist, pointInPoly, closestOnSegment, clampToPoly, wrap, rectHit };
})();

  <script>
/* src/engine/assets.js */
/* Načítání assetů z jednoho manifestu. Když obrázek chybí, scéna se vykreslí
   placeholderem — díky tomu jde pixelart doplnit později bez zásahu do kódu. */
(function () {
  const TP = (window.TP = window.TP || {});

  const assets = {
    manifest: null,
    images: {},
    ready: false,

    load(manifest, done) {
      this.manifest = manifest || { images: {}, audio: {} };
      const ids = Object.keys(this.manifest.images || {});
      if (!ids.length) { this.ready = true; done && done(); return; }
      let left = ids.length;
      const tick = () => { if (--left <= 0) { this.ready = true; done && done(); } };
      ids.forEach((id) => {
        const img = new Image();
        img.onload = tick;
        img.onerror = () => { this.images[id] = null; tick(); };
        img.src = this.manifest.images[id];
        this.images[id] = img;
      });
    },

    /** Obrázek, nebo null když se nenačetl (pak kreslíme placeholder). */
    img(id) {
      const im = id && this.images[id];
      return im && im.complete && im.naturalWidth > 0 ? im : null;
    },

    audioSrc(id) {
      return (this.manifest && this.manifest.audio && this.manifest.audio[id]) || null;
    },
  };

  TP.assets = assets;
})();

  </script>
  <script>
/* src/engine/audio.js */
/* Zvuk. Když v manifestu leží skutečné soubory, hrají se ty; jinak si engine
   vystačí s jednoduchým syntetizátorem (WebAudio), aby hra nebyla němá. */
(function () {
  const TP = (window.TP = window.TP || {});

  const audio = {
    ctx: null,
    on: true,
    musicNodes: [],
    musicTimer: null,
    current: null,
    reversed: false,

    init() {
      if (this.ctx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.28;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    },

    resume() {
      this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggle() {
      this.on = !this.on;
      if (!this.on) this.stopMusic();
      else if (this.current) this.music(this.current, this.reversed);
      return this.on;
    },

    note(freq, dur, type, gain, delay) {
      if (!this.on || !this.ctx) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
      return osc;
    },

    /** Obrácená obálka — tón se "nasává" místo doznívání. Pro finále. */
    noteReverse(freq, dur, type, gain, delay) {
      if (!this.on || !this.ctx) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq * 0.94, t0);
      osc.frequency.linearRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.2, t0 + dur * 0.92);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    },

    sfx(id) {
      this.init();
      if (!this.on || !this.ctx) return;
      const src = TP.assets.audioSrc && TP.assets.audioSrc(id);
      if (src) { try { const a = new Audio(src); a.volume = 0.6; a.play(); return; } catch (e) { /* fallback níž */ } }
      switch (id) {
        case 'click': this.note(880, 0.05, 'square', 0.06); break;
        case 'take': this.note(523, 0.08, 'triangle', 0.12); this.note(784, 0.10, 'triangle', 0.10, 0.06); break;
        case 'no': this.note(180, 0.12, 'sawtooth', 0.08); break;
        case 'flag': this.note(392, 0.12, 'sine', 0.12); this.note(587, 0.18, 'sine', 0.10, 0.09); break;
        case 'tape': this.note(120, 0.5, 'sawtooth', 0.05); break;
        case 'sting': this.note(110, 1.4, 'sawtooth', 0.10); this.note(164, 1.4, 'sine', 0.06, 0.05); break;
        case 'dog': this.note(330, 0.09, 'square', 0.10); this.note(260, 0.12, 'square', 0.08, 0.10); break;
        default: this.note(440, 0.06, 'sine', 0.08);
      }
    },

    /** Smyčka nálady. reverse = pozpátku (finále). */
    music(id, reverse) {
      this.init();
      this.stopMusic();
      this.current = id;
      this.reversed = !!reverse;
      if (!this.on || !this.ctx) return;
      const themes = {
        diner: { root: 196.00, chord: [0, 4, 7, 11], step: 1.6, type: 'sine' },
        town: { root: 146.83, chord: [0, 3, 7, 10], step: 2.0, type: 'triangle' },
        woods: { root: 110.00, chord: [0, 3, 7, 8], step: 2.4, type: 'sine' },
        red: { root: 98.00, chord: [0, 1, 6, 7], step: 1.2, type: 'sawtooth' },
      };
      const th = themes[id] || themes.diner;
      let i = 0;
      const play = () => {
        const semi = th.chord[i % th.chord.length];

/* Vyhodnocování podmínek a spouštění akcí (skriptovací vrstva nad daty).
   Akce se dávkují do zásobníku rámců, aby mohly čekat na chůzi, repliku
   nebo dokončený dialog, aniž by se blokovala smyčka hry. */
(function () {
  const TP = (window.TP = window.TP || {});

  const script = {
    frames: [],
    blocker: null,

    /** Podmínka: řetězec = vlajka, nebo objekt {not|all|any|has|nohas|flag}. */
    check(cond) {
      if (cond === undefined || cond === null) return true;
      if (typeof cond === 'string') return TP.state.flag(cond);
      if (Array.isArray(cond)) return cond.every((c) => this.check(c));
      if (cond.not !== undefined) return !this.check(cond.not);
      if (cond.all) return cond.all.every((c) => this.check(c));
      if (cond.any) return cond.any.some((c) => this.check(c));
      if (cond.has !== undefined) return TP.state.has(cond.has);
      if (cond.nohas !== undefined) return !TP.state.has(cond.nohas);
      if (cond.flag !== undefined) return TP.state.flag(cond.flag);
      if (cond.room !== undefined) return TP.state.room === cond.room;

    busy() { return this.frames.length > 0 || !!this.blocker; },

    run(ops) {

    clear() { this.frames = []; this.blocker = null; },

      if (op.unflag !== undefined) { TP.state.setFlag(op.unflag, false); return; }

        this.blocker = () => !g.player.walking;

      if (op.music !== undefined) { TP.audio.music(op.music, op.reverse); return; }

/* Dialogy jako stromy. Uzel má repliku a buď pokračování, nebo volby. */
(function () {
  const TP = (window.TP = window.TP || {});

  const dialogue = {
    active: false,
    treeId: null,
    tree: null,
    node: null,
    nodeId: null,
    lines: [],
    lineIndex: 0,
    choices: [],
    pending: [],

    start(id) {
      const tree = TP.data.dialogues[id];
      if (!tree) { console.warn('Neznámý dialog:', id); return; }
      this.treeId = id;
      this.tree = tree;
      this.pending = [];
      this.active = true;
      this.goTo(tree.start);
    },

    goTo(nodeId) {

      if (!node) { this.end(); return; }

      this.node = node;
      if (node.do) this.applyOps(node.do);
      if (node.once) TP.state.markSeen('dlg:' + this.treeId + ':' + nodeId);
      const text = node.text;
      this.lines = text === undefined ? [] : (Array.isArray(text) ? text.slice() : [text]);
      this.lineIndex = 0;
      this.choices = [];
      if (!this.lines.length) this.afterLines();
    },

    /** Vlajky a předměty musí platit hned (ovlivňují nabídku voleb). */
    applyOps(ops) {
      (Array.isArray(ops) ? ops : [ops]).forEach((op) => {
        if (!op) return;
        if (op.flag !== undefined) TP.state.setFlag(op.flag, true);
        else if (op.unflag !== undefined) TP.state.setFlag(op.unflag, false);
        else if (op.get !== undefined) { TP.state.add(op.get); TP.audio.sfx('take'); }
        else if (op.drop !== undefined) TP.state.remove(op.drop);
        else if (op.sfx !== undefined) TP.audio.sfx(op.sfx);
        else if (op.music !== undefined) TP.audio.music(op.music, op.reverse);
        else this.pending.push(op); // zbytek (go, fx, say, end) až po dialogu
      });
    },

    afterLines() {
      const node = this.node;
      if (node.choices) {
        this.choices = node.choices.filter((c) => {
          if (c.if !== undefined && !TP.script.check(c.if)) return false;
          if (c.once && TP.state.wasSeen('choice:' + this.treeId + ':' + c.once)) return false;
          return true;

        if (!this.choices.length) { this.goTo(node.next); return; }

      }
      if (node.end) { this.end(); return; }
      this.goTo(node.next);
    },

    /** Kliknutí do textu: další řádek, nebo posun na další uzel. */
    advance() {
      if (this.choices.length) return;
      if (this.lineIndex < this.lines.length - 1) { this.lineIndex++; return; }
      this.afterLines();

    pick(i) {

    end() {

})();

        F(sil || shade(bottom, -0.4));
        ctx.fillRect(x - h * 0.13 + swing, hipY, h * 0.03, h * 0.34);
        ctx.fillRect(x + h * 0.02 - swing, hipY, h * 0.03, h * 0.34);
        F(pal.ink);
        ctx.fillRect(x - h * 0.14 + swing, y - h * 0.04, h * 0.13, h * 0.04);
        ctx.fillRect(x + h * 0.01 - swing, y - h * 0.04, h * 0.13, h * 0.04);
      }

      // trup + záhyb látky
      F(top);
      ctx.fillRect(bx, shoY, bw, hipY - shoY + h * 0.02);
      F(sil || shade(top, -0.26));
      ctx.fillRect(bx, shoY, bw * 0.22, hipY - shoY + h * 0.02);
      F(sil || shade(top, 0.16));
      ctx.fillRect(bx + bw * 0.74, shoY, bw * 0.12, hipY - shoY + h * 0.02);
      if (def.apron) {
        F(def.apronColor || '#e9e4d6');
        ctx.fillRect(bx + bw * 0.18, shoY + h * 0.12, bw * 0.64, hipY - shoY - h * 0.08);
        F(sil || shade(def.apronColor || '#e9e4d6', -0.14));
        ctx.fillRect(bx + bw * 0.18, shoY + h * 0.12, bw * 0.10, hipY - shoY - h * 0.08);
      }
      if (def.tie) { F(def.tie); ctx.fillRect(x - h * 0.02, shoY + h * 0.02, h * 0.04, h * 0.18); }
      // paže
      F(top);
      ctx.fillRect(bx - h * 0.07, shoY + h * 0.02, h * 0.07, h * 0.30);
      ctx.fillRect(bx + bw, shoY + h * 0.02, h * 0.07, h * 0.30);
      F(skin);
      ctx.fillRect(bx - h * 0.07, shoY + h * 0.30, h * 0.07, h * 0.06);
      ctx.fillRect(bx + bw, shoY + h * 0.30, h * 0.07, h * 0.06);

      // hlava
      const hw = h * 0.26, hh = h * 0.24, hx = x - hw / 2, hy = shoY - hh - h * 0.02;
      F(skin); ctx.fillRect(hx, hy, hw, hh);
      F(sil || shade(skin, -0.22));
      ctx.fillRect(hx + (facing > 0 ? 0 : hw - hw * 0.22), hy, hw * 0.22, hh);
      ctx.fillRect(hx, hy + hh - h * 0.02, hw, h * 0.02);
      F(hair);
      ctx.fillRect(hx - h * 0.01, hy - h * 0.03, hw + h * 0.02, hh * (def.longHair ? 0.42 : 0.34));
      if (def.longHair) {
        ctx.fillRect(hx - h * 0.02, hy, h * 0.04, hh * 1.05);
        ctx.fillRect(hx + hw - h * 0.02, hy, h * 0.04, hh * 1.05);
      }
      F(sil || shade(hair, 0.18));
      ctx.fillRect(hx - h * 0.01, hy - h * 0.03, hw + h * 0.02, h * 0.015);
      if (def.hat) {
        F(def.hat);
        ctx.fillRect(hx - h * 0.05, hy - h * 0.04, hw + h * 0.10, h * 0.03);
        ctx.fillRect(hx, hy - h * 0.10, hw, h * 0.07);
        F(sil || shade(def.hat, -0.3));
        ctx.fillRect(hx - h * 0.05, hy - h * 0.02, hw + h * 0.10, h * 0.012);
      }
      if (def.glasses) {
        F(sil || '#1b1b1b');
        ctx.fillRect(hx + hw * 0.08, hy + hh * 0.36, hw * 0.84, h * 0.03);
      } else {
        F(pal.ink);
        const ex = facing > 0 ? hw * 0.52 : hw * 0.22;
        ctx.fillRect(hx + ex, hy + hh * 0.42, h * 0.025, h * 0.03);
        ctx.fillRect(hx + ex - h * 0.06, hy + hh * 0.42, h * 0.025, h * 0.03);
      }
    },

    dog(ctx, def, x, y, scale, facing, phase) {
      this.actor(ctx, def, x, y, scale, facing, phase, false);
    },

    dogParts(ctx, def, x, y, h, facing, phase, sitting, sil) {
      const c = def.colors || {};
      const fur = c.top || '#6b4a2f', furDark = c.hair || '#4a3220';
      const F = (col) => { ctx.fillStyle = sil || col; };
      const swing = Math.sin(phase) * h * 0.12;
      F(fur);
      ctx.beginPath(); ctx.ellipse(x, y - h * 0.45, h * 0.42, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();
      F(sil || shade(fur, -0.22));
      ctx.beginPath(); ctx.ellipse(x, y - h * 0.34, h * 0.40, h * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      F(furDark);
      ctx.fillRect(x - h * 0.32 + swing, y - h * 0.3, h * 0.1, h * 0.3);
      ctx.fillRect(x + h * 0.22 - swing, y - h * 0.3, h * 0.1, h * 0.3);
      ctx.fillRect(x - h * 0.18 - swing, y - h * 0.3, h * 0.1, h * 0.3);
      ctx.fillRect(x + h * 0.08 + swing, y - h * 0.3, h * 0.1, h * 0.3);
      ctx.fillRect(x - facing * h * 0.46, y - h * 0.72 + Math.sin(phase * 2) * h * 0.06, h * 0.1, h * 0.3);
      F(fur);
      ctx.fillRect(x + facing * h * 0.32 - h * 0.14, y - h * 0.95, h * 0.28, h * 0.26);
      ctx.fillRect(x + facing * h * 0.46 - h * 0.08, y - h * 0.82, h * 0.2 * facing, h * 0.12);
      F(furDark);
      ctx.fillRect(x + facing * h * 0.24, y - h * 1.06, h * 0.08, h * 0.12);
      F(pal.ink);
      ctx.fillRect(x + facing * h * 0.38, y - h * 0.88, h * 0.04, h * 0.04);
    },

    portrait(ctx, def, x, y, size) {
      const c = (def && def.colors) || {};
      ctx.save();
      ctx.fillStyle = '#1a1614'; ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = '#4a3f33'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      const img = TP.assets.img(def && def.portraitImg);
      if (img) { ctx.drawImage(img, x + 1, y + 1, size - 2, size - 2); ctx.restore(); return; }
      const s = size;
      // ramena
      ctx.fillStyle = c.top || '#5c6b7a';
      ctx.fillRect(x + s * 0.12, y + s * 0.72, s * 0.76, s * 0.28);
      if (def && def.shape === 'dog') {
        ctx.fillStyle = c.top || '#6b4a2f';
        ctx.fillRect(x + s * 0.22, y + s * 0.34, s * 0.56, s * 0.42);
        ctx.fillStyle = c.hair || '#4a3220';
        ctx.fillRect(x + s * 0.16, y + s * 0.2, s * 0.14, s * 0.24);
        ctx.fillRect(x + s * 0.7, y + s * 0.2, s * 0.14, s * 0.24);
        ctx.fillStyle = pal.ink;
        ctx.fillRect(x + s * 0.34, y + s * 0.5, s * 0.07, s * 0.07);
        ctx.fillRect(x + s * 0.59, y + s * 0.5, s * 0.07, s * 0.07);
        ctx.fillRect(x + s * 0.44, y + s * 0.62, s * 0.12, s * 0.08);
        ctx.restore(); return;
      }
      // hlava
      ctx.fillStyle = c.skin || '#d9a887';
      ctx.fillRect(x + s * 0.26, y + s * 0.24, s * 0.48, s * 0.52);
      ctx.fillStyle = c.hair || '#3b2a1c';
      ctx.fillRect(x + s * 0.22, y + s * 0.16, s * 0.56, s * 0.18);
      if (def && def.longHair) {
        ctx.fillRect(x + s * 0.2, y + s * 0.2, s * 0.08, s * 0.5);
        ctx.fillRect(x + s * 0.72, y + s * 0.2, s * 0.08, s * 0.5);
      }
      if (def && def.hat) {
        ctx.fillStyle = def.hat;
        ctx.fillRect(x + s * 0.14, y + s * 0.14, s * 0.72, s * 0.06);
        ctx.fillRect(x + s * 0.24, y + s * 0.04, s * 0.52, s * 0.12);
      }
      ctx.fillStyle = pal.ink;
      if (def && def.glasses) ctx.fillRect(x + s * 0.28, y + s * 0.44, s * 0.44, s * 0.06);
      else {
        ctx.fillRect(x + s * 0.36, y + s * 0.44, s * 0.06, s * 0.06);
        ctx.fillRect(x + s * 0.58, y + s * 0.44, s * 0.06, s * 0.06);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(x + s * 0.42, y + s * 0.62, s * 0.16, s * 0.03);
      ctx.restore();
    },

    /* ---------- bublina ---------- */
    bubble(ctx, b) {
      if (!b) return;
      ctx.save();
      ctx.font = font(10);
      const maxw = 210;
      const lines = U.wrap(ctx, b.text, maxw);
      let wdt = 0;
      lines.forEach((l) => { wdt = Math.max(wdt, ctx.measureText(l).width); });
      const bw = wdt + 12, bh = lines.length * 12 + 8;
      let bx = U.clamp(b.x - bw / 2, 4, W - bw - 4);
      let by = U.clamp(b.y - bh - 10, 16, SCENE_H - bh - 4);
      ctx.fillStyle = 'rgba(12,10,10,0.82)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
      ctx.fillStyle = b.color || pal.bone;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 5 + i * 12));
      ctx.restore();
    },

    /* ---------- UI ---------- */
    topBar(ctx, text) {
      if (!text) return;
      ctx.save();
      ctx.font = font(10);
      const w = ctx.measureText(text).width + 14;
      ctx.fillStyle = 'rgba(10,9,9,0.72)';
      ctx.fillRect(W / 2 - w / 2, 2, w, 15);
      ctx.fillStyle = pal.gold;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, W / 2, 10);
      ctx.restore();
    },

    inventory(ctx, game) {
      ctx.save();
      ctx.fillStyle = '#17120f'; ctx.fillRect(0, BAR_Y, W, BAR_H);
      ctx.fillStyle = '#3a2d23'; ctx.fillRect(0, BAR_Y, W, 2);
      const inv = TP.state.inv;
      for (let i = 0; i < 14; i++) {
        const x = SLOT_X + i * (SLOT + SLOT_GAP);
        ctx.fillStyle = '#201914'; ctx.fillRect(x, SLOT_Y, SLOT, SLOT);
        ctx.strokeStyle = '#332a21'; ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, SLOT_Y + 0.5, SLOT - 1, SLOT - 1);
        const id = inv[i];
        if (!id) continue;
        const it = TP.data.items[id] || {};
        const sel = game.selected === id;
        const img = TP.assets.img(it.icon);
        if (img) ctx.drawImage(img, x + 2, SLOT_Y + 2, SLOT - 4, SLOT - 4);
        else {
          ctx.fillStyle = it.color || '#7a6a58';
          ctx.fillRect(x + 4, SLOT_Y + 4, SLOT - 8, SLOT - 8);
          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.fillRect(x + 4, SLOT_Y + SLOT - 11, SLOT - 8, 7);
          ctx.fillStyle = pal.bone; ctx.font = font(9, true);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(it.short || '?', x + SLOT / 2, SLOT_Y + 11);
        }
        if (sel) {
          ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, SLOT_Y + 1, SLOT - 2, SLOT - 2);
        }
      }
      // tlačítka
      game.buttons = [
        { id: 'sound', x: 556, y: SLOT_Y, w: 30, h: SLOT, label: TP.audio.on ? '♪' : 'x' },
        { id: 'menu', x: 592, y: SLOT_Y, w: 38, h: SLOT, label: 'MENU' },
      ];
      game.buttons.forEach((b) => {
        ctx.fillStyle = '#241c16'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#3d3125'; ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
        ctx.fillStyle = pal.paper; ctx.font = font(b.id === 'sound' ? 12 : 9, true);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
      });
      ctx.restore();
    },

    dialogueBox(ctx, game) {
      const d = TP.dialogue;
      if (!d.active || !d.node) return;
      const who = d.speaker();
      const def = TP.data.actors[who] || {};
      const line = d.currentLine();

      ctx.save();
      ctx.font = font(11);
      const textLines = line === undefined ? [] : U.wrap(ctx, line, W - 92).slice(0, 3);
      const nCh = d.choices.length;
      let h = 16 + textLines.length * 14 + (nCh ? nCh * 15 + 8 : 10);
      h = Math.max(h, 58);
      const y0 = Math.max(150, H - h);

      ctx.fillStyle = 'rgba(9,8,8,0.93)'; ctx.fillRect(0, y0, W, H - y0);
      ctx.fillStyle = '#3a2d23'; ctx.fillRect(0, y0, W, 2);

      const ps = Math.min(46, H - y0 - 12);
      this.portrait(ctx, def, 9, y0 + 7, ps);
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = def.color || pal.gold;
      ctx.font = font(9, true);
      ctx.fillText((def.name || '').toUpperCase(), 64, y0 + 7);

      ctx.font = font(11); ctx.fillStyle = pal.bone;
      textLines.forEach((l, i) => ctx.fillText(l, 64, y0 + 20 + i * 14));

      game.choiceRects = [];
      if (nCh) {
        const startY = y0 + 20 + textLines.length * 14 + 4;
        d.choices.forEach((c, i) => {
          const ry = startY + i * 15;
          const hov = game.hoverChoice === i;
          ctx.font = font(10);
          ctx.fillStyle = hov ? pal.gold : '#bfae90';
          ctx.fillText((hov ? '\u25B8 ' : '  ') + c.text, 58, ry);
          game.choiceRects.push({ x: 52, y: ry - 3, w: W - 66, h: 14 });
        });
      } else {
        ctx.font = font(8);
        ctx.fillStyle = '#6d5f4e';
        ctx.textAlign = 'right';
        ctx.fillText('klikni pro pokra\u010dov\u00e1n\u00ed', W - 10, H - 11);
      }
      ctx.restore();
    },

    fx(ctx, fx) {
      if (!fx) return;
      const p = U.clamp(fx.t / fx.dur, 0, 1);
      if (fx.type === 'red') {
        const a = Math.sin(p * Math.PI) * 0.7;
        ctx.save();
        ctx.globalAlpha = a * 0.75;
        ctx.fillStyle = '#7a0f14'; ctx.fillRect(0, 0, W, SCENE_H);
        ctx.globalAlpha = a;
        // závěsy
        ctx.fillStyle = '#5c0b10';
        for (let x = 0; x < W; x += 24) ctx.fillRect(x, 0, 12, SCENE_H);
        ctx.fillStyle = '#2a0508';
        for (let x = 12; x < W; x += 24) ctx.fillRect(x, 0, 4, SCENE_H);
        // cikcak podlaha
        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = '#efe7d8';
        for (let x = -20; x < W + 20; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, SCENE_H); ctx.lineTo(x + 20, SCENE_H - 46); ctx.lineTo(x + 40, SCENE_H);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      } else if (fx.type === 'white') {
        ctx.save(); ctx.globalAlpha = Math.sin(p * Math.PI); ctx.fillStyle = '#efe7d8';
        ctx.fillRect(0, 0, W, H); ctx.restore();
      }
    },

    /** Malovaná atmosféra: teplé kaluže světla, barevný nádech, tmavé rohy
        a jemné zrno. Tohle dělá z plochých tvarů kulisu. */
    atmosphere(ctx, room) {
      const a = room && room.atmo;
      if (!a) return;
      ctx.save();
      (a.lights || []).forEach((l) => {
        const g = ctx.createRadialGradient(l[0], l[1], 0, l[0], l[1], l[2]);
        g.addColorStop(0, 'rgba(' + (l[3] || '255,208,132') + ',' + (l[4] || 0.22) + ')');
        g.addColorStop(0.6, 'rgba(' + (l[3] || '255,208,132') + ',' + (l[4] || 0.22) * 0.35 + ')');
        g.addColorStop(1, 'rgba(' + (l[3] || '255,208,132') + ',0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, SCENE_H);
      });
      if (a.wash) { ctx.fillStyle = a.wash; ctx.fillRect(0, 0, W, SCENE_H); }
      const v = a.vignette === undefined ? 0.42 : a.vignette;
      if (v > 0) {
        const g = ctx.createRadialGradient(W / 2, SCENE_H * 0.46, SCENE_H * 0.26, W / 2, SCENE_H * 0.5, W * 0.68);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.65, 'rgba(8,6,7,' + (v * 0.35).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(8,6,7,' + v + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, SCENE_H);
      }
      if (a.grain !== false) ctx.drawImage(this.grain(), 0, 0);
      ctx.restore();
    },

    /** Zrno se vyrobí jednou a pak se jen překrývá. */
    grain() {
      if (this._grain) return this._grain;
      const c = document.createElement('canvas');
      c.width = W; c.height = SCENE_H;
      const g = c.getContext('2d');
      let seed = 1337;
      const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
      for (let i = 0; i < 5200; i++) {
        const x = (rnd() * W) | 0, y = (rnd() * SCENE_H) | 0;
        g.fillStyle = rnd() > 0.5 ? 'rgba(255,240,210,0.045)' : 'rgba(0,0,0,0.055)';
        g.fillRect(x, y, 1, 1);
      }
      this._grain = c;
      return c;
    },

    /** Trvalé přebarvení scény — finále: rudá, zbytek vyšedne. */
    tint(ctx, kind) {
      if (!kind) return;
      ctx.save();
      if (kind === 'red') {
        ctx.fillStyle = 'rgba(70,78,72,0.28)'; ctx.fillRect(0, 0, W, SCENE_H);
        ctx.fillStyle = 'rgba(122,15,20,0.34)'; ctx.fillRect(0, 0, W, SCENE_H);
        ctx.fillStyle = 'rgba(12,4,6,0.30)';
        ctx.fillRect(0, 0, W, 26); ctx.fillRect(0, SCENE_H - 26, W, 26);
        ctx.fillRect(0, 0, 26, SCENE_H); ctx.fillRect(W - 26, 0, 26, SCENE_H);
      }
      ctx.restore();
    },

    fade(ctx, alpha) {
      if (alpha <= 0) return;
      ctx.save(); ctx.globalAlpha = U.clamp(alpha, 0, 1);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
    },
  };

  TP.render = render;
})();

      ctx.fillText('TWIN PEAKS', W / 2, 40);
      ctx.fillStyle = '#e8dcc0'; ctx.font = R.font(15, true);
      ctx.fillText('Ztracená kazeta', W / 2, 78);
      ctx.fillStyle = '#8d9aa0'; ctx.font = R.font(9);
      ctx.fillText('krátká adventura · soukromý dárek pro Natálii', W / 2, 100);

      game.titleRects = [];
      const bw = 190, bx = W / 2 - bw / 2;
      if (game.hasSave) {

  <script>
/* src/data/puzzles.js */
/* Logika hádanek na jednom místě. Místnosti si odsud berou hotové sekvence
   akcí, takže se dá vyvážení měnit bez zásahu do enginu. */
(function () {
  const TP = (window.TP = window.TP || {});
  TP.data = TP.data || {};

  const puzzles = {
    /* --- tutoriál: tři kávy --- */
    kava: {
      hosti: {
        hostA: { flag: 'kavaA', line: 'Řidič mlčky přikývne a hrnek podrží oběma rukama.' },
        hostB: { flag: 'kavaB', line: '„Díky, zlato. Venku je mlha jako mlíko.“' },
        hostC: { flag: 'kavaC', line: 'Pán ani nezvedne oči od novin. Hrnek si přitáhne přesně o dva centimetry.' },
      },
    },
    nalij(hostId) {
      const h = puzzles.kava.hosti[hostId];
      if (!h) return [{ say: 'Tomu kávu nenaliju.' }];
      return [
        { if: h.flag, then: [{ say: 'Tenhle hrnek je plný. Víc kávy už by bylo obtěžování.' }], else: [
          { say: 'Naliju kávu. Do tří čtvrtin, jak říkala Norma.' },
          { flag: h.flag },
          { say: h.line },
          { if: { all: ['kavaA', 'kavaB', 'kavaC'] }, then: [
            { by: 'norma', say: 'Tři hrnky a nikomu jsi nešlápla na nohu. Dobrý začátek.' },
            { flag: 'kavaHotova' },
            { by: 'norma', say: 'Běž. A drž se dál od lesa, dokud budeš mít mou zástěru.' },
          ] },
        ] },
      ];
    },

    /* --- Log Lady: zanechané, odebrané, darované --- */
    obeti: {
      hrnek: { flag: 'obetZanechane', slovo: 'zanechané',
        line: 'Polínko je teplé. Hrnek postavím vedle něj na deku.',
        react: 'Něco zanechaného. Muž, který odešel uprostřed věty.' },
      paska: { flag: 'obetOdebrane', slovo: 'odebrané',
        line: 'Pásku položím lepivou stranou vzhůru. Otisk se leskne.',
        react: 'Něco odebraného. Prst, který si myslel, že ho nikdo nevidí.' },
      kolac: { flag: 'obetDarovane', slovo: 'darované',
        line: 'Rozbalím koláč. Višně voní i v téhle zimě.',
        react: 'Něco darovaného. To je vždycky to nejtěžší.' },
    },
    obetuj(itemId) {
      const o = puzzles.obeti[itemId];
      if (!o) return null;
      return [
        { say: o.line },
        { drop: itemId },
        { flag: o.flag },
        { by: 'logLady', say: o.react },
        { if: { all: ['obetZanechane', 'obetOdebrane', 'obetDarovane'] },
          then: [{ dialog: 'polinko_mluvi' }] },
      ];
    },

    /* --- otisky (kombinace mouka + páska) je v items.js --- */
    stav() {
      return {
        kava: TP.state.flag('kavaHotova'),
        jerry: TP.state.flag('jerryZmineny'),
        karta: TP.state.has('karta'),
        otisky: TP.state.flag('otiskyShoda'),
        polinko: TP.state.flag('polinkoPromluvilo'),
      };
    },
  };

  TP.data.puzzles = puzzles;
})();

  <script>
/* src/engine/game.js */
/* Jádro hry: smyčka, vstup, chůze, přechody místností, UI stavy. */
(function () {
  const TP = (window.TP = window.TP || {});
  const U = TP.util;

  const game = {
    canvas: null, ctx: null, scale: 1,
    mode: 'title',            // title | play | end
    menuOpen: false,
    room: null,
    player: { x: 320, y: 300, tx: 320, ty: 300, walking: false, facing: 1, phase: 0 },
    selected: null,
    hoverText: '',
    hoverChoice: -1,
    hoverHotspot: null,
    bubble: null,
    fx: null,
    tint: null,
    fading: 0,
    fadeState: null,
    skipRequested: false,
    actorAnim: {},
    buttons: [],
    choiceRects: [],
    menuRects: [],
    titleRects: [],
    endText: null,
    last: 0,

    /* ---------- start ---------- */
    init() {
      this.canvas = document.getElementById('game');
      this.ctx = this.canvas.getContext('2d');
      this.ctx.imageSmoothingEnabled = false;
      TP.assets.load(window.TP_MANIFEST, () => {});
      this.bindInput();
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.hasSave = TP.state.load();
      this.mode = 'title';
      this.last = performance.now();
      requestAnimationFrame((t) => this.loop(t));
    },

    resize() {
      const maxW = window.innerWidth, maxH = window.innerHeight;
      let s = Math.min(maxW / TP.render.W, maxH / TP.render.H);
      if (s >= 1) s = Math.floor(s);
      this.scale = Math.max(0.2, s);
      this.canvas.style.width = Math.round(TP.render.W * this.scale) + 'px';
      this.canvas.style.height = Math.round(TP.render.H * this.scale) + 'px';
    },

    newGame() {
      TP.state.reset();
      this.selected = null;
      TP.script.clear();
      TP.dialogue.active = false;
      this.mode = 'play';
      this.menuOpen = false;
      TP.audio.resume();
      this.changeRoom('diner', null, 1, true);
    },

    continueGame() {
      this.mode = 'play';
      this.menuOpen = false;
      TP.audio.resume();
      const r = TP.data.rooms[TP.state.room] || TP.data.rooms.diner;
      this.room = r;
      this.player.x = TP.state.x; this.player.y = TP.state.y;
      this.player.tx = this.player.x; this.player.ty = this.player.y;
      this.player.walking = false;
      this.actorAnim = {};
      if (r.music) TP.audio.music(r.music);
    },

    /* ---------- místnosti ---------- */
    changeRoom(id, at, facing, instant) {
      const target = TP.data.rooms[id];
      if (!target) { console.warn('Neznámá místnost:', id); return; }
      const apply = () => {
        this.room = target;
        TP.state.room = id;
        const pos = at || target.start || [320, 296];
        this.player.x = pos[0]; this.player.y = pos[1];
        this.player.tx = pos[0]; this.player.ty = pos[1];
        this.player.walking = false;
        if (facing) this.player.facing = facing;
        this.actorAnim = {};
        this.selected = null;
        this.tint = null;
        TP.state.x = this.player.x; TP.state.y = this.player.y;
        TP.state.save();
        if (target.music) TP.audio.music(target.music);
        if (target.onEnter) TP.script.run(target.onEnter);
      };
      if (instant) { apply(); this.fading = 0; this.fadeState = null; return; }
      this.fading = 1;
      this.fadeState = { phase: 'out', t: 0, apply };
    },

    updateFade(dt) {
      const f = this.fadeState;
      if (!f) { this.fading = 0; return; }
      f.t += dt;
      const dur = 230;
      if (f.phase === 'out') {
        this.fadeAlpha = U.clamp(f.t / dur, 0, 1);
        if (f.t >= dur) { f.apply(); f.phase = 'in'; f.t = 0; }
      } else {
        this.fadeAlpha = 1 - U.clamp(f.t / dur, 0, 1);
        if (f.t >= dur) { this.fadeState = null; this.fading = 0; this.fadeAlpha = 0; }
      }
    },

    scaleAt(y) {
      const r = this.room;
      if (!r || !r.scale) return 1;
      const [yTop, sTop, yBot, sBot] = r.scale;
      const t = U.clamp((y - yTop) / (yBot - yTop), 0, 1);
      return U.lerp(sTop, sBot, t);
    },

    /* ---------- chůze ---------- */
    walkTo(x, y) {
      const r = this.room;
      if (!r || r.noWalk) return;
      const p = U.clampToPoly(x, y, r.walk);
      this.player.tx = p[0]; this.player.ty = p[1];
      this.player.walking = true;
    },

    updatePlayer(dt) {
      const p = this.player;
      if (!p.walking) { p.phase = 0; return; }
      const sc = this.scaleAt(p.y);
      const speed = 105 * sc * (dt / 1000);
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d <= speed || d < 0.6) {
        p.x = p.tx; p.y = p.ty; p.walking = false; p.phase = 0;
      } else {
        p.x += (dx / d) * speed;
        p.y += (dy / d) * speed;
        if (Math.abs(dx) > 1) p.facing = dx > 0 ? 1 : -1;
        p.phase += dt / 70;
      }
      TP.state.x = p.x; TP.state.y = p.y; TP.state.facing = p.facing;
    },

    moveActor(id, to, hide) {
      if (!this.actorAnim[id]) this.actorAnim[id] = {};
      const a = this.actorAnim[id];
      if (to) { a.tx = to[0]; a.ty = to[1]; }
      if (hide !== undefined) a.hidden = !!hide;
    },

    /* ---------- hotspoty ---------- */
    hotspots() {
      const r = this.room;
      if (!r) return [];
      return (r.hotspots || []).filter((h) => h.if === undefined || TP.script.check(h.if));
    },

    hotspotRect(h) {
      if (h.actor) {
        const def = TP.data.actors[h.actor] || {};
        const sc = this.scaleAt(h.y) * (h.scale || 1);
        const hh = (def.height || 52) * sc;
        const w = Math.max(24, hh * 0.5);
        return { x: h.x - w / 2, y: h.y - hh, w, h: hh };
      }
      return { x: h.x, y: h.y, w: h.w, h: h.h };
    },

    /** Z překrývajících se hotspotů vyhrává ten menší (konkrétnější):
        hrnek mouky na pultu je přednější než servírka za ním. */
    hotspotAt(x, y) {
      const list = this.hotspots();
      let best = null, bestArea = Infinity;
      for (let i = list.length - 1; i >= 0; i--) {
        const h = list[i];
        const r = this.hotspotRect(h);
        if (!U.rectHit(x, y, r)) continue;
        const area = r.w * r.h;
        if (area < bestArea) { best = h; bestArea = area; }
      }
      return best;
    },

    verbFor(h) {
      if (!h) return null;
      if (h.verb) return h.verb;
      if (h.exit) return 'go';
      if (h.actor) return 'talk';
      if (h.use) return 'use';
      return 'look';
    },

    labelFor(h) {
      if (!h) return '';
      const name = h.name || (h.actor && TP.data.actors[h.actor] && TP.data.actors[h.actor].name) || '';
      if (this.selected) {
        const it = TP.data.items[this.selected] || {};
        return 'Použít ' + (it.name || this.selected) + ' na: ' + name;
      }
      const v = this.verbFor(h);
      const pref = v === 'go' ? 'Jít: ' : v === 'talk' ? 'Promluvit: ' : v === 'take' ? 'Vzít: '
        : v === 'use' ? 'Použít: ' : 'Prohlédnout: ';
      return pref + name;
    },

    /* ---------- interakce ---------- */
    defaultLine(kind) {
      const lines = {
        look: ['Nic zvláštního.', 'Nic, co by teď pomohlo.', 'Vypadá to úplně obyčejně. Což v tomhle městě nic neznamená.'],
        use: ['To nejde.', 'Tohle asi ne.', 'Nechám to být.'],
        useWith: ['Tohle dohromady nedává smysl.', 'Ne. Ani trochu.', 'Zkusila jsem to. Nic.'],
        far: ['Tam se nedostanu.'],
      };
      const arr = lines[kind] || lines.look;
      return arr[Math.floor(Math.random() * arr.length)];
    },

    interact(h, verb) {
      if (!h) return;
      const ops = [];
      if (h.walkTo && !this.room.noWalk) ops.push({ walkTo: h.walkTo });
      if (h.face) ops.push({ face: h.face });
      let body = null;
      if (verb === 'look') body = h.look || [{ say: h.lookText || this.defaultLine('look') }];
      else if (verb === 'go') {
        if (h.blockedIf && TP.script.check(h.blockedIf)) body = h.blocked || [{ say: 'Tudy teď ne.' }];
        else body = h.use || [{ go: h.exit, at: h.exitAt, facing: h.exitFacing }];
      } else if (verb === 'talk') body = h.talk || h.use || [{ say: this.defaultLine('use') }];
      else body = h.use || h.talk || h.look || [{ say: this.defaultLine('use') }];
      TP.script.run(ops.concat(body));
    },

    useItemOn(itemId, h) {
      const item = TP.data.items[itemId] || {};
      const ops = [];
      if (h.walkTo && !this.room.noWalk) ops.push({ walkTo: h.walkTo });
      if (h.face) ops.push({ face: h.face });
      let body = (h.useWith && h.useWith[itemId]) || (item.useOn && item.useOn[h.id]) || null;
      if (!body) {
        const target = h.name || '';
        body = [{ say: item.failLine || this.defaultLine('useWith') }];
        if (h.useWithFail) body = h.useWithFail;
        void target;
      }
      this.selected = null;
      TP.script.run(ops.concat(body));
    },

    combineItems(a, b) {
      const ia = TP.data.items[a] || {}, ib = TP.data.items[b] || {};
      const rec = (ia.combine && ia.combine[b]) || (ib.combine && ib.combine[a]);
      this.selected = null;
      if (rec) { TP.script.run(rec); return; }
      TP.script.run([{ say: this.defaultLine('useWith') }]);
    },

    /* ---------- bubliny / efekty ---------- */
    showBubble(who, text) {
      const def = TP.data.actors[who] || {};
      let x = 320, y = 120;
      if (who === 'natalie') { x = this.player.x; y = this.player.y - (def.height || 52) * this.scaleAt(this.player.y) - 4; }
      else {
        const h = this.hotspots().find((s) => s.actor === who);
        if (h) { x = h.x; y = h.y - (TP.data.actors[h.actor].height || 52) * this.scaleAt(h.y) * (h.scale || 1) - 4; }
        else { x = 320; y = 90; }
      }
      this.bubble = { text, x, y, color: def.color || TP.render.pal.bone };
    },

    hideBubble() { this.bubble = null; },

    startFx(type, dur) {
      this.fx = { type, t: 0, dur, done: false };
      if (type === 'red') TP.audio.sfx('sting');
    },

    endGame() {
      this.mode = 'end';
      TP.audio.music('red', true);
    },

    /* ---------- vstup ---------- */
    bindInput() {
      const c = this.canvas;
      const toScene = (ev) => {
        const r = c.getBoundingClientRect();
        const px = (ev.clientX - r.left) / (r.width / TP.render.W);
        const py = (ev.clientY - r.top) / (r.height / TP.render.H);
        return { x: px, y: py };
      };
      c.addEventListener('contextmenu', (e) => e.preventDefault());
      c.addEventListener('pointermove', (e) => {
        const p = toScene(e);
        this.updateHover(p.x, p.y);
      });
      c.addEventListener('pointerdown', (e) => {
        TP.audio.resume();
        const p = toScene(e);
        this.pressPos = p;
        this.pressTime = performance.now();
        this.longDone = false;
        if (e.button === 2) { this.longDone = true; this.click(p.x, p.y, true); }
        this.longTimer = setTimeout(() => {
          if (this.longDone) return;
          this.longDone = true;
          this.click(p.x, p.y, true);
        }, 480);
      });
      c.addEventListener('pointerup', (e) => {
        clearTimeout(this.longTimer);
        if (this.longDone) { this.longDone = false; return; }
        const p = toScene(e);
        this.click(p.x, p.y, false);
      });
      c.addEventListener('pointerleave', () => { clearTimeout(this.longTimer); this.hoverText = ''; });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { if (this.mode === 'play') this.menuOpen = !this.menuOpen; }
        if (e.key === ' ' || e.key === 'Enter') this.skipRequested = true;
      });
    },

    updateHover(x, y) {
      this.hoverChoice = -1;
      if (this.mode !== 'play') { this.hoverText = ''; return; }
      if (TP.dialogue.active) {
        this.choiceRects.forEach((r, i) => { if (U.rectHit(x, y, r)) this.hoverChoice = i; });
        this.hoverText = '';
        return;
      }
      if (y >= TP.render.BAR_Y) {
        const id = this.invSlotAt(x, y);
        const it = id && TP.data.items[id];
        this.hoverText = it ? (this.selected && this.selected !== id
          ? 'Použít ' + (TP.data.items[this.selected] || {}).name + ' na: ' + it.name
          : 'Prohlédnout: ' + it.name) : '';
        return;
      }
      const h = this.hotspotAt(x, y);
      this.hoverHotspot = h;
      this.hoverText = h ? this.labelFor(h) : (this.selected ? 'Použít ' + (TP.data.items[this.selected] || {}).name : '');
    },

    invSlotAt(x, y) {
      const R = TP.render;
      if (y < R.SLOT_Y || y > R.SLOT_Y + R.SLOT) return null;
      for (let i = 0; i < 14; i++) {
        const sx = R.SLOT_X + i * (R.SLOT + R.SLOT_GAP);
        if (x >= sx && x <= sx + R.SLOT) return TP.state.inv[i] || null;
      }
      return null;
    },

    click(x, y, secondary) {
      if (this.mode === 'title') { this.titleClick(x, y); return; }
      if (this.mode === 'end') { this.mode = 'title'; TP.audio.music('diner'); return; }
      if (this.menuOpen) { this.menuClick(x, y); return; }

      if (TP.dialogue.active) {
        if (TP.dialogue.choices.length) {
          for (let i = 0; i < this.choiceRects.length; i++) {
            if (U.rectHit(x, y, this.choiceRects[i])) { TP.dialogue.pick(i); return; }
          }
          return;
        }
        TP.dialogue.advance();
        return;
      }

      if (TP.script.busy()) { this.skipRequested = true; return; }

      // spodní lišta
      if (y >= TP.render.BAR_Y) {
        const btn = (this.buttons || []).find((b) => U.rectHit(x, y, b));
        if (btn) {
          TP.audio.sfx('click');
          if (btn.id === 'sound') TP.audio.toggle();
          else this.menuOpen = true;
          return;
        }
        const id = this.invSlotAt(x, y);
        if (!id) { this.selected = null; return; }
        const item = TP.data.items[id] || {};
        if (secondary) { this.selected = null; TP.script.run(item.look || [{ say: 'Obyčejná věc. Zatím.' }]); return; }
        if (this.selected && this.selected !== id) { this.combineItems(this.selected, id); return; }
        this.selected = this.selected === id ? null : id;
        TP.audio.sfx('click');
        return;
      }

      // scéna
      const h = this.hotspotAt(x, y);
      if (this.selected) {
        if (h) this.useItemOn(this.selected, h);
        else { this.selected = null; TP.script.run([{ say: this.defaultLine('useWith') }]); }
        return;
      }
      if (h) { this.interact(h, secondary ? 'look' : this.verbFor(h)); return; }
      if (secondary) { TP.script.run([{ say: this.defaultLine('look') }]); return; }
      if (this.room && !this.room.noWalk) { this.walkTo(x, y); }
    },

    titleClick(x, y) {
      for (const r of this.titleRects) {
        if (U.rectHit(x, y, r)) {
          TP.audio.resume();
          if (r.id === 'new') this.newGame();
          else if (r.id === 'continue') this.continueGame();
          else if (r.id === 'sound') TP.audio.toggle();
          return;
        }
      }
    },

    menuClick(x, y) {
      for (const r of this.menuRects) {
        if (U.rectHit(x, y, r)) {
          TP.audio.sfx('click');
          if (r.id === 'resume') this.menuOpen = false;
          else if (r.id === 'sound') TP.audio.toggle();
          else if (r.id === 'new') { this.menuOpen = false; this.newGame(); }
          else if (r.id === 'title') { this.menuOpen = false; this.mode = 'title'; this.hasSave = true; }
          return;
        }
      }
      this.menuOpen = false;
    },

    /* ---------- smyčka ---------- */
    loop(t) {
      const dt = Math.min(64, t - this.last);
      this.last = t;
      this.update(dt);
      this.draw();
      requestAnimationFrame((tt) => this.loop(tt));
    },

    update(dt) {
      if (this.mode !== 'play') return;
      if (this.fadeState) this.updateFade(dt);
      if (this.fx) {
        this.fx.t += dt;
        if (this.fx.t >= this.fx.dur) { this.fx.done = true; this.fx = null; }
      }
      if (!this.menuOpen) {
        this.updatePlayer(dt);
        TP.script.update(dt);
      }
      // animace vedlejších postav
      Object.keys(this.actorAnim).forEach((id) => {
        const a = this.actorAnim[id];
        if (a.tx === undefined) return;
        const h = this.hotspots().find((s) => s.actor === id);
        if (!h) return;
        if (a.x === undefined) { a.x = h.x; a.y = h.y; }
        const dx = a.tx - a.x, dy = a.ty - a.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const sp = 70 * (dt / 1000);
        if (d <= sp) { a.x = a.tx; a.y = a.ty; a.arrived = true; }
        else { a.x += (dx / d) * sp; a.y += (dy / d) * sp; a.phase = (a.phase || 0) + dt / 70; a.facing = dx > 0 ? 1 : -1; }
      });
    },

    draw() {
      const ctx = this.ctx, R = TP.render;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, R.W, R.H);
      if (this.mode === 'title') { TP.screens.title(ctx, this); ctx.restore(); return; }
      if (this.mode === 'end') { TP.screens.end(ctx, this); ctx.restore(); return; }

      const room = this.room;
      if (room) {
        const bg = room.bg && TP.assets.img(room.bg);
        if (bg) ctx.drawImage(bg, 0, 0, R.W, R.SCENE_H);
        R.layer(ctx, room.art, false, !!bg);
        // postavy a kulisy s hloubkou (z) v jednom pořadí odzadu dopředu
        const drawables = [];
        if (!bg) {
          (room.art || []).forEach((sh) => {
            if (sh.z === undefined) return;
            if (sh.if !== undefined && !TP.script.check(sh.if)) return;
            drawables.push({ shape: sh, y: sh.z });
          });
        }
        this.hotspots().forEach((h) => {
          if (!h.actor) return;
          const a = this.actorAnim[h.actor] || {};
          if (a.hidden) return;
          drawables.push({
            def: TP.data.actors[h.actor] || {},
            x: a.x !== undefined ? a.x : h.x,
            y: a.y !== undefined ? a.y : h.y,
            facing: a.facing || h.facing || 1,
            sitting: h.sitting,
            phase: a.phase || 0,
            sc: (h.scale || 1),
          });
        });
        if (!room.noWalk && !room.hidePlayer) {
          drawables.push({
            def: TP.data.actors.natalie, x: this.player.x, y: this.player.y,
            facing: this.player.facing, phase: this.player.phase, sc: 1,
          });
        }
        drawables.sort((a, b) => a.y - b.y);
        drawables.forEach((d) => {
          if (d.shape) R.shape(ctx, d.shape);
          else R.actor(ctx, d.def, d.x, d.y, this.scaleAt(d.y) * d.sc, d.facing, d.phase, d.sitting);
        });
        R.atmosphere(ctx, room);
        R.layer(ctx, room.art, true, !!(room.bg && TP.assets.img(room.bg)));
      }

      R.tint(ctx, this.tint);
      R.fx(ctx, this.fx);
      R.bubble(ctx, this.bubble);
      if (!TP.dialogue.active) {
        R.topBar(ctx, this.hoverText);
        R.inventory(ctx, this);
      } else {
        R.dialogueBox(ctx, this);
      }
      R.fade(ctx, this.fadeAlpha || 0);
      if (this.menuOpen) TP.screens.menu(ctx, this);
      ctx.restore();
    },
  };

  TP.game = game;
  window.addEventListener('load', () => game.init());
})();

  </script>
</body>

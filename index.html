<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specimen A–E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f2ede4;
    --card: #fffdf8;
    --ink: #241f1a;
    --ink-soft: #6b6154;
    --rule: #ddd3c2;
    --accent: #a8442e;
    --accent-ink: #fff8f1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191510;
      --card: #221d17;
      --ink: #f2ece1;
      --ink-soft: #a89a86;
      --rule: #3a332a;
      --accent: #e2764f;
      --accent-ink: #1a1209;
    }
  }
  :root[data-theme="dark"] {
    --ground: #191510;
    --card: #221d17;
    --ink: #f2ece1;
    --ink-soft: #a89a86;
    --rule: #3a332a;
    --accent: #e2764f;
    --accent-ink: #1a1209;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }

  .specimen {
    width: min(92vw, 420px);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2rem 2.25rem 1.75rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.9rem;
  }

  .masthead .title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .masthead .range {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 0 2.25rem;
  }

  #letter {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(7rem, 24vw, 9.5rem);
    line-height: 1;
    color: var(--ink);
    transition: opacity 0.15s ease;
  }

  #letter.rolling { opacity: 0.25; }

  .meta {
    margin-top: 0.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    min-height: 1.2em;
  }

  .glyphs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.4rem;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.85rem 0;
  }

  .glyphs button {
    all: unset;
    text-align: center;
    font-family: "Fraunces", serif;
    font-size: 1.05rem;
    color: var(--ink-soft);
    padding: 0.3rem 0;
    border-radius: 3px;
    cursor: pointer;
  }

  .glyphs button:hover,
  .glyphs button:focus-visible {
    color: var(--ink);
    background: var(--rule);
  }

  .glyphs button[aria-current="true"] {
    color: var(--accent-ink);
    background: var(--accent);
  }

  .glyphs button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .draw {
    all: unset;
    display: block;
    width: 100%;
    margin-top: 1.5rem;
    text-align: center;
    padding: 0.85rem 0;
    border-radius: 3px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .draw:hover { filter: brightness(1.06); }
  .draw:active { filter: brightness(0.96); }
  .draw:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    #letter { transition: none; }
  }
</style>
</head>
<body>
  <main class="specimen">
    <div class="masthead">
      <span class="title">Náhodné písmeno</span>
      <span class="range">A–E</span>
    </div>

    <div class="stage">
      <div id="letter">A</div>
      <div class="meta" id="meta">U+0041 · vzorek 1 z 5</div>
    </div>

    <div class="glyphs" id="glyphs" role="group" aria-label="Historie losování"></div>

    <button class="draw" id="draw">Losovat písmeno</button>
  </main>

  <script>
    const letters = ["A", "B", "C", "D", "E"];
    const letterEl = document.getElementById("letter");
    const metaEl = document.getElementById("meta");
    const glyphsEl = document.getElementById("glyphs");
    const drawEl = document.getElementById("draw");

    let count = 0;
    let current = "A";

    function codePoint(ch) {
      return "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");
    }

    function renderGlyphs() {
      glyphsEl.innerHTML = "";
      letters.forEach((ch) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = ch;
        b.setAttribute("aria-current", String(ch === current));
        b.disabled = true;
        glyphsEl.appendChild(b);
      });
    }

    function draw() {
      count += 1;
      letterEl.classList.add("rolling");
      window.setTimeout(() => {
        current = letters[Math.floor(Math.random() * letters.length)];
        letterEl.textContent = current;
        metaEl.textContent = `${codePoint(current)} · vzorek ${count} z 5`;
        letterEl.classList.remove("rolling");
        renderGlyphs();
      }, 90);
    }

    renderGlyphs();
    drawEl.addEventListener("click", draw);
  </script>
</body>
</html>

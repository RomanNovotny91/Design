<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generátor náhodných písmen</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f7;
      --accent: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem 3rem;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    width: min(90vw, 380px);
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
    opacity: 0.8;
  }
  #letter {
    font-size: 6rem;
    font-weight: 800;
    color: var(--accent);
    margin: 0 0 1.5rem;
    min-height: 6rem;
    line-height: 1;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.8rem 1.8rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="card">
    <h1>Generátor náhodných písmen (A–E)</h1>
    <div id="letter">?</div>
    <button id="generate">Generovat</button>
  </div>

  <script>
    const letters = ["A", "B", "C", "D", "E"];
    const letterEl = document.getElementById("letter");
    const buttonEl = document.getElementById("generate");

    function generateLetter() {
      const randomIndex = Math.floor(Math.random() * letters.length);
      letterEl.textContent = letters[randomIndex];
    }

    buttonEl.addEventListener("click", generateLetter);
  </script>
</body>
</html>
